<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Studio — Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #131820;
    --border: #1e2a38;
    --text: #e0e4ea;
    --text-muted: #6a7a8e;
    --accent: #c9a03a;
    --accent-dim: #8a6d28;
    --green: #4fc35a;
    --red: #e0556a;
    --radius: 8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  header .project-selector {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-family: var(--font);
    font-size: 13px;
    outline: none;
  }
  header select:focus { border-color: var(--accent); }
  header .status {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  header .status-dot.ok { background: var(--green); }
  header .status-dot.error { background: var(--red); }

  /* ── Main layout ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Pane: Script Editor ── */
  .pane-script {
    width: 360px;
    min-width: 240px;
    max-width: 70%;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    position: relative;
  }
  .pane-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pane-header .btn {
    font-size: 11px;
    padding: 4px 10px;
  }
  .script-editor {
    flex: 1;
    padding: 20px;
    background: transparent;
    color: var(--text);
    border: none;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    resize: none;
    outline: none;
    tab-size: 2;
    overflow-y: auto;
    min-height: 0;
  }
  .script-editor:focus {
    background: rgba(201, 160, 58, 0.03);
  }

  /* ── Pane: Storyboard ── */
  .pane-storyboard {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 360px;
  }
  .storyboard-grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    align-content: start;
  }
  .scene-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: visible;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s;
  }
  .scene-card:hover { border-color: var(--accent-dim); }
  .scene-card.approved { border-color: var(--green); }
  .scene-card.locked { border-color: var(--accent-dim); }
  .scene-card.empty {
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .scene-image {
    width: 100%;
    height: 160px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
    position: relative;
    flex-shrink: 0;
  }
  .scene-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scene-image .placeholder {
    text-align: center;
    padding: 20px;
    line-height: 1.5;
  }
  .scene-image .placeholder.generating {
    color: var(--accent);
  }

  /* ── Pane: Tools (Prompts + Exports) ── */
  .pane-tools {
    width: 320px;
    min-width: 320px;
    max-width: 320px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .tools-tabs {
    display: flex;
    gap: 4px;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--bg);
    color: var(--accent);
    border-color: var(--border);
  }
  .tools-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tools-content.hidden { display: none; }
  .prompts-toolbar, .exports-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .prompts-toolbar select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: inherit;
  }
  .prompt-status {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
  }
  .prompt-status.dirty { color: var(--accent); font-style: normal; }

  /* Prominent toolbar actions (scoped so global .btn is unchanged) */
  .prompts-toolbar select {
    padding: 6px 10px;
  }
  .prompts-toolbar .btn {
    font-size: 12px;
    padding: 7px 16px;
    font-weight: 600;
  }
  /* Reset = tertiary: lowest visual weight */
  .prompts-toolbar #prompts-reset-btn {
    background: transparent;
    color: var(--text-muted);
    border-color: var(--border);
    font-weight: 500;
  }
  .prompts-toolbar #prompts-reset-btn:hover {
    background: #1e3040;
    color: #fff;
    border-color: var(--accent);
  }
  /* Regen = secondary */
  .prompts-toolbar #prompts-regen-btn:hover {
    background: #36506a;
  }
  /* Save = primary: largest and boldest */
  .prompts-toolbar #prompts-save-btn {
    font-size: 13px;
    padding: 8px 22px;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(201,160,58,0.35);
  }
  .prompts-toolbar #prompts-save-btn:hover {
    background: #e0ba52;
  }
  .prompts-toolbar .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: auto;
    box-shadow: none;
  }

  .prompts-editor {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }
  .prompts-editor .field {
    margin-bottom: 16px;
  }
  .prompts-editor .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .prompts-editor .field-help {
    font-size: 11px;
    color: var(--text-muted);
    margin: 4px 0 0;
    line-height: 1.4;
  }
  .prompts-editor textarea {
    width: 100%;
    min-height: 120px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  .prompts-editor textarea:focus {
    border-color: var(--accent-dim);
    background: rgba(201, 160, 58, 0.03);
  }
  .prompts-editor textarea.template {
    min-height: 80px;
    color: var(--text-muted);
    background: var(--bg);
    cursor: default;
  }
  .prompts-editor .motion-hints {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .prompts-editor .motion-hint-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
    align-items: start;
  }
  .prompts-editor .motion-hint-row .name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    padding-top: 8px;
  }
  .prompts-editor .motion-hint-row textarea {
    min-height: 50px;
  }
  .exports-list {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }
  .export-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .export-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .export-item-name {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }
  .export-item-meta {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .export-item-subdir {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .export-item video {
    width: 100%;
    max-height: 240px;
    background: #000;
    border-radius: 4px;
    display: block;
  }
  .export-item-actions {
    margin-top: 8px;
    display: flex;
    gap: 6px;
  }
  .export-item-actions .btn {
    font-size: 11px;
    padding: 3px 8px;
  }
  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 24px;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(201,160,58,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .scene-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .scene-time {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .scene-text {
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
  }
  .scene-text textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: var(--font);
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .scene-text textarea:focus { border-color: var(--accent); }

  .scene-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .btn {
    background: #1e3040;
    color: #c0d0e0;
    border: 1px solid #2d4050;
    border-radius: 4px;
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: #2d4050; border-color: var(--accent); color: #fff; }
  .btn.primary { background: var(--accent); color: #0b0f14; font-weight: 600; border-color: var(--accent); }
  .btn.primary:hover { background: #d4ae4a; }
  .btn.approve { background: #2a5a4a; color: #b0f0d0; border-color: var(--green); }
  .btn.approve:hover { background: var(--green); color: #0b0f14; }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn.danger:hover { background: rgba(224,85,106,0.15); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .badge.approved { background: rgba(79,195,168,0.15); color: var(--green); }
  .badge.draft { background: rgba(106,122,142,0.15); color: var(--text-muted); }
  .badge.locked { background: rgba(201,160,58,0.15); color: var(--accent); }
  .badge.version {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.7); color: #ccc;
    font-size: 9px; z-index: 2;
  }

  .img-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.5); color: #fff; border: none;
    font-size: 20px; padding: 4px 8px; cursor: pointer;
    z-index: 2; line-height: 1; border-radius: 3px;
  }
  .img-nav:hover { background: rgba(0,0,0,0.8); color: var(--accent); }
  .img-nav.prev { left: 4px; }
  .img-nav.next { right: 4px; }

  /* ── Footer ── */
  footer {
    padding: 10px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-muted);
  }
  footer .render-status { display: flex; align-items: center; gap: 8px; }
  footer .render-status .error { color: var(--red); }
  #render-btn.hidden { display: none; }

  /* v3 per-scene workspace (default as of v2.0; pass ?v1=1 for legacy grid) */
  .storyboard-grid.v3-workspace {
    display: block;
  }
  .storyboard-grid.v3-workspace .scene-card {
    width: 100%;
  }
  .storyboard-grid.v3-workspace .scene-image {
    height: 320px;
  }

  /* v1.1.1 — scene sidebar + workspace shell */
  .v3-workspace-shell {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .v3-scene-list {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
  }
  .v3-scene-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    transition: background 0.12s;
  }
  .v3-scene-item:hover { background: rgba(201,160,58,0.04); }
  .v3-scene-item.active { background: rgba(201,160,58,0.08); }
  .v3-scene-item .status-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .v3-scene-item .status-icon.approved { color: var(--green); }
  .v3-scene-item .status-icon.in-progress { color: var(--accent); }
  .v3-scene-item .status-icon.no-image { color: var(--text-muted); }
  .v3-scene-item .scene-num {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    flex-shrink: 0;
    min-width: 20px;
  }
  .v3-scene-item .scene-preview {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }
  .v3-workspace-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .v3-workspace-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    flex-shrink: 0;
  }
  .v3-tab-bar {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .v3-tab-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .v3-tab-body.hidden { display: none; }
  /* v1.1.5 — mini-scene strip (horizontal thumbnail scroller, v3 only) */
  .v3-scene-strip {
    min-height: 80px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    align-items: flex-start;
  }
  .v3-scene-strip .strip-thumb {
    display: inline-block;
    width: 100px;
    flex-shrink: 0;
    margin-right: 6px;
    cursor: pointer;
    border-radius: 4px;
    overflow: hidden;
  }
  .v3-scene-strip .strip-thumb img {
    width: 100%;
    height: 70px;
    object-fit: cover;
    border-radius: 4px;
    border: 2px solid transparent;
    transition: border-color 0.12s;
    display: block;
  }
  .v3-scene-strip .strip-thumb.active img { border-color: var(--accent); }
  .v3-scene-strip .strip-thumb:hover img { border-color: var(--accent-dim); }
  .v3-scene-strip .strip-placeholder {
    width: 100%;
    height: 70px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 18px;
    border-radius: 4px;
    border: 2px solid transparent;
  }
  .v3-scene-strip .strip-thumb.active .strip-placeholder { border-color: var(--accent); }
  .v3-scene-strip .strip-thumb:hover .strip-placeholder { border-color: var(--accent-dim); }
  .v3-scene-strip .strip-label {
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 2px;
    line-height: 1;
  }
  /* selection legend below the mini-strip: accent border = scene selected, green border = image active */
  #v3-legend {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #v3-legend .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  #v3-legend .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Assets tab gallery + undo toast */
  .assets-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .assets-gallery {
    display: flex; gap: 8px; padding: 14px;
    overflow-x: auto; flex-shrink: 0; min-height: 100px;
  }
  .assets-thumb {
    width: 120px; flex-shrink: 0; cursor: pointer;
    border: 2px solid transparent; border-radius: 6px;
    overflow: hidden; transition: border-color 0.15s;
    background: var(--surface); position: relative;
  }
  .assets-thumb:hover { border-color: var(--accent-dim); }
  .assets-thumb.active { border-color: var(--green); }
  .assets-thumb img { width: 100%; height: 80px; object-fit: cover; display: block; }
  .assets-thumb-label { padding: 4px 6px; font-size: 10px; color: var(--text-muted); text-align: center; }
  .assets-thumb .badge.approved-badge {
    position: absolute; top: 4px; right: 4px;
    background: var(--green); color: #0b0f14;
    font-size: 9px; padding: 1px 5px; border-radius: 8px; font-weight: 700;
  }
  .assets-preview {
    flex: 1; display: flex; align-items: center;
    justify-content: center; padding: 14px;
    background: #000; min-height: 200px; overflow: hidden;
  }
  .assets-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 18px; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-size: 13px;
    transition: opacity 0.3s;
  }
  .toast.hidden { display: none; }
  #v3-tab-assets { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
  #v3-tab-assets.hidden { display: none; }

  /* ── Captions tab (v1.1.3) ── */
  .captions-editor {
    padding: 14px;
    overflow-y: auto;
    flex: 1;
  }
  .caption-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .caption-card-fields {
    display: grid;
    grid-template-columns: 1fr 110px 80px 80px 80px;
    gap: 8px;
    align-items: start;
  }
  .caption-card-fields .field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;

  #v3-tab-captions.hidden { display: none; }

  /* ── Render tab (v1.1.4) ── */
  .render-editor {
    padding: 14px;

    flex: 1;

  .render-toolbar {

  #v3-tab-render { display: flex; flex-direction: column; overflow: hidden; padding: 0; }

  /* ── Script pane resize handle ── */
  .pane-resize-handle {

  body.resizing-script-pane {

  /* ── Script pane minimize / icon button ── */

    width: 24px;
    height: 24px;
    padding: 0;
    display: inline-flex;

</style>
</head>

<div class="toast hidden" id="undo-toast">
  <span id="undo-toast-msg">Unapproved.</span>
  <button class="btn" id="undo-btn">Undo</button>
</div>

<script>
'use strict';

const API = '';

// URL feature flag read ONCE at init (before any rendering).
// Default ON: v3 per-scene workspace is the primary dashboard as of v2.0.
// Pass ?v1=1 to opt back into the legacy v2 grid (kept for rollback).
const __urlParams = new URLSearchParams(window.location.search);
const __v3 = __urlParams.get('v1') !== '1';

// Single source of client state. The grid is always re-rendered from here,
// so transient UI (the generating spinner) survives SSE-triggered reloads.
const state = {
  slug: '',
  scenes: [],
  generating: new Set(),   // scene ids with a pending generation
  originalScript: '',
  loadToken: 0,            // guards against out-of-order loadProject responses
  prompts: null,           // { image: {...}, video: {...} } loaded from /api/.../prompts
  promptsDirty: false,     // user edited but not saved
  selectedScene: null,     // currently focused scene for re-generate
  v3Mode: __v3,            // v3 per-scene workspace is the default dashboard as of v2.0; pass ?v1=1 for legacy grid
  v3Index: 0,              // current scene index when v3Mode (clamped on render)
  undoTimeout: null,       // setTimeout handle for undo toast
  undoSceneId: null,       // scene id for undo operation
};

const $ = (id) => document.getElementById(id);

// ── Helpers ──

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function imageUrl(path) {
  // Storyboard paths are project-relative; tolerate older absolute variants.
  const clean = String(path)
    .replace(/^\/+/, '')
    .replace(new RegExp(`^projects/${state.slug}/`), '');
  return `/projects/${encodeURIComponent(state.slug)}/${clean}`;
}

async function api(path, options) {
  const resp = await fetch(API + path, options);
  let data = null;
  try { data = await resp.json(); } catch { /* non-JSON error body */ }
  if (!resp.ok) {
    throw new Error(data?.detail || `${resp.status} ${resp.statusText}`);
  }
  return data;
}

function setStatus(text, kind = 'ok') {
  $('status-dot').className = `status-dot ${kind}`;
  $('status-text').textContent = text;
}

function setRenderMsg(text, isError = false) {
  const el = $('render-msg');
  el.textContent = text;
  el.className = isError ? 'error' : '';
  const toolsMsg = $('tools-render-msg');
  if (toolsMsg) { toolsMsg.textContent = text; toolsMsg.classList.toggle('error', !!isError); }
}

// ── SSE ──

function connectSSE() {
  const es = new EventSource(`${API}/api/project/watch`);

  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    // Events may carry an argument after a colon, e.g. "gen-requested:3".
    const [kind, arg] = String(data.event || '').split(':');
    const sceneId = Number(arg);

    switch (kind) {
      case 'connected':
        setStatus('connected');
        break;
      case 'ping':
        break;
      case 'gen-requested':
        // Generation started (possibly by another client or the agent):
        // show the spinner, don't reload — nothing on disk changed yet.
        if (Number.isFinite(sceneId)) {
          state.generating.add(sceneId);
          renderStoryboard();
          setRenderMsg(`Generating scene ${sceneId}…`);
        }
        break;
      case 'image-added':
        if (Number.isFinite(sceneId)) {
          state.generating.delete(sceneId);
          setRenderMsg(`Scene ${sceneId}: image ready`);
        }
        reloadCurrent(data.slug);
        break;
      default:
        // refresh, scene-approved, storyboard-updated, script-updated, render-queued
        reloadCurrent(data.slug);
    }
  };

  es.onerror = () => {
    setStatus('disconnected — retrying…', 'error');
    es.close();
    setTimeout(connectSSE, 2000);
  };
}

function reloadCurrent(slug) {
  const target = state.slug || slug;
  if (target) loadProject(target);
}

// ── Project loading ──

async function listProjects() {
  const projects = await api('/api/projects');
  const sel = $('project-select');
  for (const p of projects) {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  }
  return projects;
}

async function loadProject(slug) {
  if (!slug) return;
  state.slug = slug;
  $('project-select').value = slug;
  $('project-path').textContent = `projects/${slug}/`;

  const token = ++state.loadToken;
  try {
    const data = await api(`/api/project/${encodeURIComponent(slug)}`);
    if (token !== state.loadToken) return; // superseded by a newer load

    state.scenes = data.storyboard?.scenes || [];

    // v3: start at first scene when (re)loading a project
    if (state.v3Mode) state.v3Index = 0;

    // Script — show best available artifact, but never clobber unsaved edits.
    const editor = $('script-editor');
    const incoming = data.script ?? data.SPINE ?? data.brief ?? '';
    const dirty = editor.value !== state.originalScript;
    if (!dirty) {
      editor.value = incoming;
      state.originalScript = incoming;
      $('save-script-btn').disabled = true;
    }

    renderStoryboard();
    updateRenderGate();
    setStatus('connected');

    // Side panels: load prompts + exports for this project
    await loadPrompts();
    await loadExports();
  } catch (err) {
    setStatus(err.message, 'error');
    console.error('loadProject failed:', err);
  }
}

function updateRenderGate() {
  const allApproved = state.scenes.length > 0 &&
    state.scenes.every((s) => (s.images || []).some((v) => v.approved));
  $('render-btn').disabled = !allApproved;
  if (allApproved && !$('render-msg').textContent) {
    setRenderMsg('All scenes approved ✓');
  }
  $('render-btn').classList.toggle('hidden', state.v3Mode);
  $('tools-render-btn').disabled = !allApproved || !state.v3Mode;
}

// ── Storyboard rendering ──

function renderStoryboard() {
  const grid = $('storyboard-grid');
  const scenes = state.scenes;

  if (state.v3Mode) {
    $('sb-count').textContent = scenes.length ? `Scene ${Math.min(state.v3Index + 1, scenes.length)} of ${scenes.length}` : `${scenes.length} scenes`;
  } else {
    $('sb-count').textContent = `${scenes.length} scenes`;
  }

  if (!scenes.length) {
    grid.innerHTML = '<div class="scene-card empty">No storyboard yet</div>';
    grid.classList.remove('v3-workspace');
    if (state.v3Mode) {
      grid.style.display = '';
      $('v3-workspace-shell').style.display = 'none';
      $('v3-scene-strip').style.display = 'none';
      $('v3-legend').style.display = 'none';
    }
    return;
  }

  if (!state.v3Mode) {
    // Default (v3=0 or absent): exact original grid behavior, no changes
    grid.innerHTML = scenes.map(sceneCard).join('');
    grid.classList.remove('v3-workspace');
    return;
  }

  // v3Mode (default as of v2.0): per-scene workspace shell (sidebar + tabbed panel) replaces
  // the single-card + Prev/Next layout. See renderV3Workspace() below.
  state.v3Index = Math.max(0, Math.min(state.v3Index, scenes.length - 1));
  renderV3Workspace();
}

function sceneCard(s) {
  const versions = s.images || [];
  const total = versions.length;
  const idx = total ? Math.min(s.current_image || 0, total - 1) : 0;
  const current = versions[idx];
  const generating = state.generating.has(s.id);
  const hasApproved = versions.some((v) => v.approved);

  const imgHtml = generating
    ? `<div class="placeholder generating"><span class="spinner"></span> Generating…<br><small>scene ${s.id}</small></div>`
    : current
      ? `<img src="${escHtml(imageUrl(current.path))}" alt="Scene ${s.id} v${idx + 1}">`
      : `<div class="placeholder">Scene ${s.id}<br><small>No image generated</small></div>`;

  const navArrows = total > 1 ? `
      <button class="img-nav prev" data-action="prev" title="Previous version">‹</button>
      <button class="img-nav next" data-action="next" title="Next version">›</button>` : '';

  const versionBadge = total > 0
    ? `<span class="badge version">v${idx + 1}/${total}</span>`
    : '';

  const status = hasApproved ? 'approved' : (s.locked ? 'locked' : 'draft');
  const statusText = hasApproved ? '✓ Approved' : (s.locked ? '🔒 Locked' : 'Draft');

  return `
    <div class="scene-card ${status}" data-scene-id="${s.id}">
      <div class="scene-image">
        ${imgHtml}
        ${navArrows}
        ${versionBadge}
      </div>
      <div class="scene-info">
        <div class="scene-time">Scene ${s.id} · ${escHtml(s.time_in || '')}–${escHtml(s.time_out || '')}</div>
        <div class="scene-text">
          <textarea data-field="text" placeholder="Scene narration...">${escHtml(s.text || '')}</textarea>
        </div>
        <div class="scene-actions">
          <span class="badge ${status}">${statusText}</span>
          <button class="btn" data-action="generate" ${s.locked || generating ? 'disabled' : ''}>🖼 Gen</button>
          <button class="btn" data-action="lock">${s.locked ? 'Unlock' : 'Lock'}</button>
          <button class="btn approve" data-action="approve" ${hasApproved || !current ? 'disabled' : ''}>✓</button>
        </div>
      </div>
    </div>`;
}

// ── Scene actions ──

async function generateVersion(id) {
  state.generating.add(id);
  if (state.v3Mode && state.scenes[state.v3Index]?.id === id) renderV3Assets();
  else renderStoryboard();
  setRenderMsg(`Generating scene ${id}…`);
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}/image`, { method: 'POST' });
    // Image is now on disk — reload to show it
    state.generating.delete(id);
    await loadProject(state.slug);
    setRenderMsg(`Scene ${id}: image ready`);
  } catch (err) {
    state.generating.delete(id);
    if (state.v3Mode && state.scenes[state.v3Index]?.id === id) renderV3Assets();
    else renderStoryboard();
    setRenderMsg(`Scene ${id}: ${err.message}`, true);
  }
}

async function navigateImage(id, delta) {
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}/navigate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta }),
    });
    await loadProject(state.slug);
  } catch (err) {
    setRenderMsg(`Scene ${id}: ${err.message}`, true);
  }
}

async function lockScene(id, locked) {
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ locked }),
    });
    await loadProject(state.slug);
  } catch (err) {
    setRenderMsg(`Scene ${id}: ${err.message}`, true);
  }
}

async function approveCurrent(id) {
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}/approve`, { method: 'POST' });
    await loadProject(state.slug);
  } catch (err) {
    setRenderMsg(`Scene ${id}: ${err.message}`, true);
  }
}

async function updateSceneText(id, text) {
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
  } catch (err) {
    setRenderMsg(`Scene ${id}: ${err.message}`, true);
  }
}

// ── Script + render ──

async function saveScript() {
  const editor = $('script-editor');
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/script`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: editor.value }),
    });
    state.originalScript = editor.value;
    $('save-script-btn').disabled = true;
  } catch (err) {
    setRenderMsg(`Save failed: ${err.message}`, true);
  }
}

async function triggerRender() {
  setRenderMsg('Rendering…');
  $('render-btn').disabled = true;
  try {
    const data = await api(`/api/project/${encodeURIComponent(state.slug)}/render`, { method: 'POST' });
    setRenderMsg(data.message || 'Render queued');
  } catch (err) {
    setRenderMsg(err.message, true);
    $('render-btn').disabled = false;
  }
}

// ── Event wiring (delegation — cards are re-rendered as plain HTML) ──

function wireEvents() {
  $('project-select').addEventListener('change', (e) => loadProject(e.target.value));
  $('save-script-btn').addEventListener('click', saveScript);
  $('render-btn').addEventListener('click', triggerRender);
  $('script-editor').addEventListener('input', (e) => {
    $('save-script-btn').disabled = e.target.value === state.originalScript;
  });

  const grid = $('storyboard-grid');

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = Number(btn.closest('[data-scene-id]')?.dataset.sceneId);
    if (!Number.isFinite(id)) return;
    const scene = state.scenes.find((s) => s.id === id);

    switch (btn.dataset.action) {
      case 'generate': generateVersion(id); break;
      case 'lock': lockScene(id, !scene?.locked); break;
      case 'approve': approveCurrent(id); break;
      case 'prev': navigateImage(id, -1); break;
      case 'next': navigateImage(id, 1); break;
      case 'scene-prev':
        if (state.v3Mode && state.scenes.length) {
          state.v3Index = Math.max(0, state.v3Index - 1);
          renderStoryboard();
        }
        break;
      case 'scene-next':
        if (state.v3Mode && state.scenes.length) {
          state.v3Index = Math.min(state.scenes.length - 1, state.v3Index + 1);
          renderStoryboard();
        }
        break;
    }
  });

  grid.addEventListener('change', (e) => {
    if (!e.target.matches('textarea[data-field="text"]')) return;
    const id = Number(e.target.closest('[data-scene-id]')?.dataset.sceneId);
    if (Number.isFinite(id)) updateSceneText(id, e.target.value);
  });

  // Track selected scene for "Re-generate selected scene" in Prompts pane
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('[data-scene-id]');
    if (!card) return;
    const id = Number(card.dataset.sceneId);
    if (!Number.isFinite(id)) return;
    state.selectedScene = id;
    updateRegenButton();
  });

  // Tools pane — tab switching
  document.querySelectorAll('[data-tools-tab]').forEach((btn) => {
    btn.addEventListener('click', () => switchToolsTab(btn.dataset.toolsTab));
  });

  // Prompts pane
  $('prompts-kind').addEventListener('change', () => renderPromptsEditor());
  $('prompts-save-btn').addEventListener('click', savePrompts);
  $('prompts-reset-btn').addEventListener('click', resetPrompts);
  $('prompts-regen-btn').addEventListener('click', regenerateSelected);

  // Exports pane
  $('exports-refresh-btn').addEventListener('click', () => loadExports());

  // Render tab (TOOLS pane)
  $('tools-render-btn').addEventListener('click', triggerRender);
}

// ── Tools pane: Prompts ──

function switchToolsTab(name) {
  document.querySelectorAll('[data-tools-tab]').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.toolsTab === name);
  });
  document.querySelectorAll('.tools-content').forEach((c) => {
    c.classList.toggle('hidden', c.dataset.pane !== name);
  });
}

async function loadPrompts() {
  if (!state.slug) return;
  try {
    const data = await api(`/api/project/${encodeURIComponent(state.slug)}/prompts`);
    state.prompts = data.prompts;
    state.promptsDirty = false;
    $('prompts-status').textContent = data.is_default ? 'default' : 'custom';
    $('prompts-status').classList.remove('dirty');
    $('prompts-save-btn').disabled = true;
    renderPromptsEditor();
    updateRegenButton();
  } catch (err) {
    console.error('loadPrompts failed:', err);
  }
}

function renderPromptsEditor() {
  const container = $('prompts-editor');
  if (!state.prompts) {
    container.innerHTML = '<div class="empty">No project loaded</div>';
    return;
  }
  const kind = $('prompts-kind').value; // 'image' | 'video'
  const data = state.prompts[kind];
  if (!data) {
    container.innerHTML = `<div class="empty">No ${kind} prompt templates</div>`;
    return;
  }

  const fields = [];
  for (const [name, value] of Object.entries(data)) {
    if (name === 'motion_hints') {
      const rows = Object.entries(value).map(([hintName, hintText]) => `
        <div class="motion-hint-row">
          <span class="name">${escHtml(hintName)}</span>
          <textarea data-path="${kind}.motion_hints.${hintName}">${escHtml(hintText)}</textarea>
        </div>
      `).join('');
      fields.push(`
        <div class="field">
          <label class="field-label">Motion Hints (video)</label>
          <p class="field-help">Per-preset motion language. Pick one per scene video gen.</p>
          <div class="motion-hints">${rows}</div>
        </div>
      `);
    } else if (name.endsWith('_template')) {
      if (__v3) {
        fields.push(`
          <div class="field">
            <label class="field-label">${escHtml(name)} (template, read-only)</label>
            <p class="field-help">The prompts above are prepended automatically. The scene-specific direction comes after.</p>
          </div>
        `);
      } else {
        fields.push(`
          <div class="field">
            <label class="field-label">${escHtml(name)} (template, read-only)</label>
            <p class="field-help">Use <code>{visual_direction}</code>, <code>{beacon_world}</code>, etc. as placeholders.</p>
            <textarea class="template" readonly>${escHtml(value)}</textarea>
          </div>
        `);
      }
    } else {
      const helpText = name === 'beacon_world'
        ? 'Brand-level canon. See DESIGN.md §1. Reused across all scenes.'
        : name === 'video_style'
          ? 'Video-specific visual treatment. See DESIGN.md §2.'
          : '';
      fields.push(`
        <div class="field">
          <label class="field-label">${escHtml(name)}</label>
          <p class="field-help">${escHtml(helpText)}</p>
          <textarea data-path="${kind}.${name}">${escHtml(value)}</textarea>
        </div>
      `);
    }
  }
  container.innerHTML = fields.join('');

  container.querySelectorAll('textarea[data-path]').forEach((ta) => {
    ta.addEventListener('input', () => {
      const path = ta.dataset.path.split('.');
      let cursor = state.prompts;
      for (let i = 0; i < path.length - 1; i++) cursor = cursor[path[i]];
      const last = path[path.length - 1];
      if (cursor[last] !== ta.value) {
        cursor[last] = ta.value;
        state.promptsDirty = true;
        $('prompts-status').textContent = 'unsaved changes';
        $('prompts-status').classList.add('dirty');
        $('prompts-save-btn').disabled = false;
      }
    });
  });
}

async function savePrompts() {
  if (!state.slug || !state.prompts) return;
  try {
    await api(`/api/project/${encodeURIComponent(state.slug)}/prompts`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompts: state.prompts }),
    });
    state.promptsDirty = false;
    $('prompts-status').textContent = 'custom';
    $('prompts-status').classList.remove('dirty');
    $('prompts-save-btn').disabled = true;
    setRenderMsg('Prompts saved ✓');
  } catch (err) {
    setRenderMsg(`Save failed: ${err.message}`, true);
  }
}

async function resetPrompts() {
  if (!state.slug) return;
  if (state.promptsDirty &&
      !confirm('Discard unsaved changes and reset to defaults?')) return;
  try {
    await fetch(`/api/project/${encodeURIComponent(state.slug)}/prompts`, {
      method: 'DELETE',
    });
    await loadPrompts();
    setRenderMsg('Prompts reset to defaults ✓');
  } catch (err) {
    setRenderMsg(`Reset failed: ${err.message}`, true);
  }
}

function updateRegenButton() {
  // in v3 mode, the active scene drives regen even if `selectedScene` is null
  const activeId = state.selectedScene != null ? state.selectedScene
    : (state.v3Mode && state.scenes[state.v3Index] ? state.scenes[state.v3Index].id : null);
  $('prompts-regen-btn').disabled = !(
    state.slug && activeId != null && !state.promptsDirty
  );
  const btn = $('prompts-regen-btn');
  if (activeId != null) {
    btn.textContent = `Regen scene ${activeId}`;
    btn.title = `Re-generate scene ${activeId}`;
  } else {
    btn.textContent = 'Regen';
    btn.title = 'Re-generate selected scene';
  }
}

async function regenerateSelected() {
  const id = state.selectedScene != null ? state.selectedScene
    : (state.v3Mode && state.scenes[state.v3Index] ? state.scenes[state.v3Index].id : null);
  if (!state.slug || id == null) return;
  try {
    await api(
      `/api/project/${encodeURIComponent(state.slug)}/storyboard/${id}/image`,
      { method: 'POST' }
    );
    setRenderMsg(`Requested regen for scene ${id}. Agent will pick up via SSE.`);
  } catch (err) {
    setRenderMsg(`Regen failed: ${err.message}`, true);
  }
}

// ── Tools pane: Exports ──

async function loadExports() {
  if (!state.slug) return;
  const list = $('exports-list');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const data = await api(`/api/project/${encodeURIComponent(state.slug)}/exports`);
    $('exports-count').textContent = `${data.exports.length} files`;
    if (data.exports.length === 0) {
      list.innerHTML = '<div class="empty">No exports yet. Render the project to generate videos here.</div>';
      return;
    }
    list.innerHTML = data.exports.map(renderExportItem).join('');
  } catch (err) {
    list.innerHTML = `<div class="empty">Error: ${escHtml(err.message)}</div>`;
  }
}

function renderExportItem(exp) {
  const sizeMB = (exp.size / (1024 * 1024)).toFixed(1);
  const when = new Date(exp.mtime * 1000).toLocaleString();
  const subdir = exp.subdir
    ? `<div class="export-item-subdir">${escHtml(exp.subdir)}/</div>`
    : '';
  return `
    <div class="export-item" data-path="${escHtml(exp.path)}">
      ${subdir}
      <div class="export-item-header">
        <span class="export-item-name">${escHtml(exp.name)}</span>
        <span class="export-item-meta">${sizeMB} MB · ${escHtml(when)}</span>
      </div>
      <video controls preload="metadata" src="${escHtml(exp.url)}"></video>
      <div class="export-item-actions">
        <a class="btn" href="${escHtml(exp.url)}" target="_blank" rel="noopener">Open in new tab</a>
        <a class="btn" href="${escHtml(exp.url)}" download>Download</a>
      </div>
    </div>
  `;
}

// ── v3 (default as of v2.0) per-scene workspace: scene sidebar + tabbed panel ──
// Additive and reached only when state.v3Mode is true; the default grid path
// never calls into here, so the v3=off behavior is unchanged.

function v3SceneStatus(scene) {
  // Sidebar status glyph, by precedence: approved (any approved version) →
  // in-progress (has a version) → no-image. Mirrors sceneCard()'s badge.
  const versions = scene.images || [];
  if (versions.some((v) => v.approved)) return { icon: '●', cls: 'approved' };
  if (versions.length) return { icon: '▸', cls: 'in-progress' };
  return { icon: '○', cls: 'no-image' };
}

function renderV3SceneList() {
  const list = $('v3-scene-list');
  list.innerHTML = state.scenes.map((s, i) => {
    const { icon, cls } = v3SceneStatus(s);
    const text = (s.text || '').trim();
    const preview = text
      ? escHtml(text.slice(0, 60)) + (text.length > 60 ? '…' : '')
      : 'No text';
    return `
    <div class="v3-scene-item ${i === state.v3Index ? 'active' : ''}" data-scene-index="${i}">
      <span class="status-icon ${cls}">${icon}</span>
      <span class="scene-num">${s.id}</span>
      <span class="scene-preview">${preview}</span>
    </div>`;
  }).join('');
}

function renderV3SceneStrip() {
  const strip = $('v3-scene-strip');
  if (!strip) return;
  const scenes = state.scenes || [];
  strip.innerHTML = scenes.map((scene, i) => {
    const versions = scene.images || [];
    const approved = versions.find((v) => v.approved);
    const img = approved || (versions.length ? versions[0] : null);
    const isActive = (i === state.v3Index);
    const thumbInner = img
      ? `<img src="${escHtml(imageUrl(img.path))}" alt="Scene ${scene.id}">`
      : `<div class="strip-placeholder">&mdash;</div>`;
    return `
    <div class="strip-thumb${isActive ? ' active' : ''}" data-scene-index="${i}">
      ${thumbInner}
      <div class="strip-label">S${scene.id}</div>
    </div>`;
  }).join('');
}

function renderV3Workspace() {
  wireV3Events();

  // Hand the storyboard area over to the split-panel shell.
  $('storyboard-grid').style.display = 'none';
  $('v3-workspace-shell').style.display = 'flex';

  $('v3-scene-strip').style.display = '';
  $('v3-legend').style.display = '';
  renderV3SceneList();
  renderV3SceneStrip();

  const scene = state.scenes[state.v3Index];
  const text = (scene?.text || '').trim();
  $('v3-workspace-header').textContent = text
    ? `Scene ${scene.id} — ${text.slice(0, 80)}${text.length > 80 ? '…' : ''}`
    : `Scene ${scene.id}`;

  renderV3Assets();
  // Refresh the active tab's content for the new scene
  const activeTab = document.querySelector('#v3-tab-bar .tab-btn.active');
  if (activeTab) {
    const tabName = activeTab.dataset.v3Tab;
    if (tabName === 'captions') renderV3Captions();
    else if (tabName === 'render') renderV3Render();
  }
}

function switchV3Tab(name) {
  document.querySelectorAll('#v3-tab-bar [data-v3-tab]').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.v3Tab === name);
  });
  ['assets', 'captions', 'render'].forEach((tab) => {
    $(`v3-tab-${tab}`).classList.toggle('hidden', tab !== name);
  });
  if (name === 'assets') renderV3Assets();
  if (name === 'captions') renderV3Captions();
  if (name === 'render') renderV3Render();
}

function wireV3Events() {
  if (wireV3Events.done) return;   // static containers — wire delegation once
  wireV3Events.done = true;

  // Scene list: the container is stable while its items are re-rendered, so
  // delegate clicks from the container rather than rebinding per item.
  $('v3-scene-list').addEventListener('click', (e) => {
    const item = e.target.closest('.v3-scene-item');
    if (!item) return;
    const i = Number(item.dataset.sceneIndex);
    if (!Number.isFinite(i)) return;
    const scene = state.scenes[i];
    state.v3Index = i;
    state.selectedScene = scene ? scene.id : null;   // keep prompts-pane regen in sync
    updateRegenButton();
    renderStoryboard();
  });

  // Mini scene strip
  $('v3-scene-strip').addEventListener('click', (e) => {
    const thumb = e.target.closest('.strip-thumb');
    if (!thumb) return;
    const i = Number(thumb.dataset.sceneIndex);
    if (!Number.isFinite(i)) return;
    const scene = state.scenes[i];
    state.v3Index = i;
    state.selectedScene = scene ? scene.id : null;
    updateRegenButton();
    renderStoryboard();
  });

  // Tab bar.
  $('v3-tab-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-v3-tab]');
    if (btn) switchV3Tab(btn.dataset.v3Tab);
  });

  // Assets tab: Gen button
  $('assets-gen-btn').addEventListener('click', async () => {
    const scene = state.scenes[state.v3Index];
    if (scene) {
      state.selectedScene = scene.id;
      updateRegenButton();
      await generateVersion(scene.id);
      renderV3Assets();
    }
  });

  // Assets tab: Regen button
  $('assets-regen-btn').addEventListener('click', async () => {
    const scene = state.scenes[state.v3Index];
    if (!scene) return;
    try {
      await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + scene.id + '/image', { method: 'POST' });
      setRenderMsg('Requested regen for scene ' + scene.id + '.');
      renderV3Assets();
    } catch (err) {
      setRenderMsg(err.message, true);
    }
  });

  // Assets tab: Unapprove button
  $('assets-unapprove-btn').addEventListener('click', async () => {
    const scene = state.scenes[state.v3Index];
    if (!scene) return;
    try {
      const data = await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + scene.id + '/unapprove', { method: 'POST' });
      showUndoToast(scene.id, data.prev_approved_path);
      await loadProject(state.slug);
    } catch (err) {
      setRenderMsg(err.message, true);
    }
  });

  // Undo toast button
  $('undo-btn').addEventListener('click', async () => {
    const sid = state.undoSceneId;
    hideUndoToast();
    if (sid != null) {
      try {
        await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + sid + '/approve', { method: 'POST' });
        await loadProject(state.slug);
      } catch (err) {
        setRenderMsg(err.message, true);
      }
    }
  });

  // Assets gallery: click variant to approve (single-active-approve)
  $('v3-tab-assets').addEventListener('click', async (e) => {
    const thumb = e.target.closest('.assets-thumb');
    if (!thumb) return;
    const idx = Number(thumb.dataset.variantIndex);
    if (!Number.isFinite(idx)) return;
    const scene = state.scenes[state.v3Index];
    if (!scene) return;

    try {
      // Navigate to this variant first
      await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + scene.id + '/navigate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta: idx - (scene.current_image || 0) }),
      });
      // Then approve it (single-active-approve — server clears all other variants)
      await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + scene.id + '/approve', { method: 'POST' });
      await loadProject(state.slug);
    } catch (err) {
      setRenderMsg(err.message, true);
    }
  });

  // Captions tab: + Add phrase, remove phrase
  $('v3-tab-captions').addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]');
    if (!action) return;
    const scene = state.scenes[state.v3Index];
    if (!scene) return;
    if (action.dataset.action === 'add-phrase') {
      const phrases = (scene.caption_phrases || []).slice();
      const last = phrases[phrases.length - 1];
      const newPhrase = {
        text: '',
        role: 'display',
        time_in: last ? (last.time_out || last.time_in || 0) : 0,
        time_out: last ? ((last.time_out || last.time_in || 0) + 3) : 3,
      };
      phrases.push(newPhrase);
      scene.caption_phrases = phrases;
      renderV3Captions();
      debounceSaveCaptions();
    } else if (action.dataset.action === 'remove-phrase') {
      const idx = Number(action.dataset.idx);
      if (Number.isFinite(idx)) {
        scene.caption_phrases = (scene.caption_phrases || []).filter((_, i) => i !== idx);
        renderV3Captions();
        debounceSaveCaptions();
      }
    }
  });
}

// ── Assets tab ──
function renderV3Assets() {
  const scene = state.scenes[state.v3Index];
  if (!scene) return;

  const versions = scene.images || [];
  const gallery = $('assets-gallery');
  const preview = $('assets-preview');

  // Gallery
  if (!versions.length) {
    gallery.innerHTML = '<div class="empty">No images yet. Generate one using the Gen button above.</div>';
    preview.style.display = 'none';
  } else {
    renderV3AssetsGallery(scene);
    renderV3AssetsPreview(scene);
    preview.style.display = 'flex';
  }

  // Button states
  const hasApproved = versions.some(v => v.approved);
  $('assets-unapprove-btn').disabled = !hasApproved;
  $('assets-regen-btn').disabled = false;

  // Badge
  const badge = $('assets-status-badge');
  if (hasApproved) {
    badge.textContent = '\u2713 Approved';
    badge.className = 'badge approved';
    badge.style.display = 'inline-block';
  } else if (versions.length > 0) {
    badge.textContent = 'Draft';
    badge.className = 'badge draft';
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function renderV3AssetsGallery(scene) {
  const gallery = $('assets-gallery');
  const versions = scene.images || [];
  const idx = Math.min(scene.current_image || 0, versions.length - 1);

  gallery.innerHTML = versions.map((v, i) => {
    const active = i === idx ? ' active' : '';
    const approved = v.approved ? '<span class="badge approved-badge">Approved</span>' : '';
    return '<div class="assets-thumb' + active + '" data-variant-index="' + i + '">' +
      '<img src="' + escHtml(imageUrl(v.path)) + '" alt="v' + (i + 1) + '">' +
      approved +
      '<div class="assets-thumb-label">v' + (i + 1) + '</div>' +
      '</div>';
  }).join('');
}

function renderV3AssetsPreview(scene) {
  const img = $('assets-preview-img');
  const versions = scene.images || [];
  const idx = Math.min(scene.current_image || 0, versions.length - 1);
  const v = versions[idx];
  if (v) {
    img.src = imageUrl(v.path);
  }
}

function showUndoToast(sceneId, prevPath) {
  if (state.undoTimeout) {
    clearTimeout(state.undoTimeout);
    state.undoTimeout = null;
  }
  state.undoSceneId = sceneId;
  let msg = 'Unapproved.';
  if (prevPath) {
    const parts = prevPath.split('/');
    msg = 'Unapproved ' + parts[parts.length - 1] + '.';
  }
  $('undo-toast-msg').textContent = msg;
  $('undo-toast').classList.remove('hidden');
  state.undoTimeout = setTimeout(() => {
    hideUndoToast();
  }, 5000);
}

function hideUndoToast() {
  $('undo-toast').classList.add('hidden');
  if (state.undoTimeout) {
    clearTimeout(state.undoTimeout);
    state.undoTimeout = null;
  }
  state.undoSceneId = null;
}

// ── Captions tab (v1.1.3) ──

let _saveCaptionsTimer = null;

function debounceSaveCaptions() {
  if (_saveCaptionsTimer) clearTimeout(_saveCaptionsTimer);
  _saveCaptionsTimer = setTimeout(saveV3Captions, 500);
}

async function saveV3Captions() {
  const scene = state.scenes[state.v3Index];
  if (!scene) return;
  const container = $('v3-tab-captions');
  const phrases = [];
  container.querySelectorAll('.caption-card').forEach((card) => {
    const get = (field) => {
      const el = card.querySelector(`[data-field="${field}"]`);
      return el ? el.value : '';
    };
    const num = (s, fallback) => {
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : fallback;
    };
    const role = get('role') || 'display';
    const obj = {
      text: get('text'),
      role: role,
      time_in: num(get('time_in'), 0),
      time_out: num(get('time_out'), 0),
    };
    if (role === 'body') {
      const fs = parseInt(get('font_size'), 10);
      if (Number.isFinite(fs)) obj.font_size = fs;
    }
    phrases.push(obj);
  });
  const status = $('captions-save-status');
  if (status) { status.textContent = 'saving…'; }
  try {
    await api('/api/project/' + encodeURIComponent(state.slug) + '/storyboard/' + scene.id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption_phrases: phrases }),
    });
    scene.caption_phrases = phrases;
    if (status) {
      status.textContent = 'saved ✓';
      setTimeout(() => { if (status.textContent === 'saved ✓') status.innerHTML = '&nbsp;'; }, 1500);
    }
  } catch (err) {
    if (status) status.textContent = 'save failed: ' + err.message;
  }
}

function renderV3Captions() {
  const container = $('v3-tab-captions');
  const scene = state.scenes[state.v3Index];
  if (!scene) {
    container.innerHTML = '<div class="captions-editor"><div class="empty">No scene selected</div></div>';
    return;
  }
  const phrases = scene.caption_phrases || [];

  if (!phrases.length) {
    container.innerHTML =
      '<div class="captions-editor">' +
        '<div style="margin-bottom:8px;font-size:11px;color:var(--text-muted)" id="captions-save-status">&nbsp;</div>' +
        '<div class="empty" style="margin-bottom:16px">No captions yet. Add your first phrase below.</div>' +
        '<button class="btn primary" data-action="add-phrase">+ Add phrase</button>' +
      '</div>';
    return;
  }

  const cardsHtml = phrases.map((p, i) => {
    const wordCount = (p.text || '').trim() ? (p.text || '').trim().split(/\s+/).length : 0;
    const estDuration = (wordCount * 0.15).toFixed(1);
    const showFontSize = p.role === 'body';
    const safe = (s) => escHtml(s == null ? '' : String(s));
    return '' +
    '<div class="caption-card" data-idx="' + i + '">' +
      '<div class="caption-card-fields">' +
        '<div class="field caption-card-text">' +
          '<label class="field-label">Text</label>' +
          '<input type="text" value="' + safe(p.text) + '" data-idx="' + i + '" data-field="text" placeholder="Caption text...">' +
        '</div>' +
        '<div class="field caption-card-role">' +
          '<label class="field-label">Role</label>' +
          '<select data-idx="' + i + '" data-field="role">' +
            '<option value="display"' + (p.role === 'display' ? ' selected' : '') + '>Display</option>' +
            '<option value="body"' + (p.role === 'body' ? ' selected' : '') + '>Body</option>' +
          '</select>' +
        '</div>' +
        '<div class="field caption-card-time">' +
          '<label class="field-label">In</label>' +
          '<input type="number" value="' + safe(p.time_in) + '" step="0.5" min="0" data-idx="' + i + '" data-field="time_in" placeholder="0.0">' +
        '</div>' +
        '<div class="field caption-card-time">' +
          '<label class="field-label">Out</label>' +
          '<input type="number" value="' + safe(p.time_out) + '" step="0.5" min="0" data-idx="' + i + '" data-field="time_out" placeholder="0.0">' +
        '</div>' +
        '<div class="field caption-card-fs' + (showFontSize ? '' : ' hidden') + '">' +
          '<label class="field-label">Font</label>' +
          '<input type="number" value="' + safe(p.font_size) + '" step="1" min="1" placeholder="56" data-idx="' + i + '" data-field="font_size">' +
        '</div>' +
      '</div>' +
      '<div class="caption-timing-estimate">(est. ~' + estDuration + 's)</div>' +
      '<button class="btn" style="color:var(--red);border-color:var(--red);margin-top:8px" data-action="remove-phrase" data-idx="' + i + '">✕ Remove</button>' +
    '</div>';
  }).join('');

  container.innerHTML =
    '<div class="captions-editor">' +
      '<div style="margin-bottom:8px;font-size:11px;color:var(--text-muted)" id="captions-save-status">&nbsp;</div>' +
      cardsHtml +
      '<button class="btn primary" data-action="add-phrase">+ Add phrase</button>' +
    '</div>';

  // Wire input change → debounced save
  container.querySelectorAll('input[data-field], select[data-field]').forEach((el) => {
    el.addEventListener('input', debounceSaveCaptions);
    el.addEventListener('change', debounceSaveCaptions);
  });
  // Wire role change → toggle font-size visibility inline
  container.querySelectorAll('select[data-field="role"]').forEach((sel) => {
    sel.addEventListener('change', () => {
      const idx = sel.dataset.idx;
      const card = container.querySelector(`.caption-card[data-idx="${idx}"]`);
      if (!card) return;
      const fs = card.querySelector('.caption-card-fs');
      if (fs) fs.classList.toggle('hidden', sel.value !== 'body');
    });
  });
}

// ── Render tab (v1.1.4) ──

const RENDER_PRESETS = [
  'drift_left', 'drift_right', 'zoom_in',
  'push_in_left', 'push_in_right', 'parallax_lr', 'parallax_rl',
];

let _v3RenderState = {
  quality: 'draft',
  motion_override: '',     // empty = use scene's preset
  rendering: false,
  last_path: '',
};

function renderV3Render() {
  const container = $('v3-tab-render');
  const scene = state.scenes[state.v3Index];
  if (!scene) {
    container.innerHTML = '<div class="render-editor"><div class="empty">No scene selected</div></div>';
    return;
  }

  const presetsOptions = RENDER_PRESETS.map((p) =>
    '<option value="' + p + '"' + (_v3RenderState.motion_override === p ? ' selected' : '') + '>' + p + '</option>'
  ).join('');

  const videoHtml = _v3RenderState.last_path
    ? '<video controls preload="metadata" src="/projects/' + encodeURIComponent(state.slug) + '/renders/' + _v3RenderState.last_path + '"></video>'
    : '<div class="empty">No render yet. Click Re-render below.</div>';

  const metaHtml = _v3RenderState.last_path
    ? '<div class="render-meta">File: <code>projects/' + escHtml(state.slug) + '/renders/' + escHtml(_v3RenderState.last_path) + '</code></div>'
    : '';

  container.innerHTML =
    '<div class="render-editor">' +
      '<div class="render-toolbar">' +
        '<label>Quality</label>' +
        '<select id="render-quality">' +
          '<option value="draft"' + (_v3RenderState.quality === 'draft' ? ' selected' : '') + '>draft</option>' +
          '<option value="high"' + (_v3RenderState.quality === 'high' ? ' selected' : '') + '>high</option>' +
        '</select>' +
        '<label>Motion</label>' +
        '<select id="render-motion">' +
          '<option value="">(scene default: ' + escHtml(scene.motion_preset || 'drift_left') + ')</option>' +
          presetsOptions +
        '</select>' +
        '<button class="btn primary" id="render-go-btn" ' + (_v3RenderState.rendering ? 'disabled' : '') + '>' +
          (_v3RenderState.rendering ? '⟳ Rendering…' : 'Re-render this scene') +
        '</button>' +
        (_v3RenderState.last_path
          ? '<button class="btn" id="render-download-btn">Download</button>' +
            '<button class="btn" id="render-delete-btn" style="color:var(--red)">Delete</button>'
          : '') +
      '</div>' +
      '<div class="render-preview">' + videoHtml + '</div>' +
      metaHtml +
      '<div class="render-footer-note">This is per-scene preview. For full project render, use the TOOLS → Render tab.</div>' +
    '</div>';

  // Wire
  $('render-quality').addEventListener('change', (e) => { _v3RenderState.quality = e.target.value; });
  $('render-motion').addEventListener('change', (e) => { _v3RenderState.motion_override = e.target.value; });
  $('render-go-btn').addEventListener('click', () => v3RenderGo(scene));
  if (_v3RenderState.last_path) {
    $('render-download-btn').addEventListener('click', () => {
      window.open('/projects/' + encodeURIComponent(state.slug) + '/renders/' + _v3RenderState.last_path, '_blank');
    });
    $('render-delete-btn').addEventListener('click', () => v3RenderDelete(scene));
  }
}

async function v3RenderGo(scene) {
  if (_v3RenderState.rendering) return;
  _v3RenderState.rendering = true;
  renderV3Render();
  try {
    const body = {
      quality: _v3RenderState.quality,
      motion_override: _v3RenderState.motion_override || null,
    };
    const data = await api(
      '/api/project/' + encodeURIComponent(state.slug) +
      '/storyboard/' + scene.id + '/render-scene',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    );
    if (data && data.path) {
      // path is "renders/scene-NN.mp4" — extract just the filename
      const parts = data.path.split('/');
      _v3RenderState.last_path = parts[parts.length - 1];
    }
    setRenderMsg('Rendered scene ' + scene.id);
  } catch (err) {
    setRenderMsg('Render failed: ' + err.message, true);
  } finally {
    _v3RenderState.rendering = false;
    renderV3Render();
  }
}

async function v3RenderDelete(scene) {
  try {
    await api(
      '/api/project/' + encodeURIComponent(state.slug) +
      '/storyboard/' + scene.id + '/render-scene/delete',
      { method: 'POST' }
    );
    _v3RenderState.last_path = '';
    setRenderMsg('Render deleted');
    renderV3Render();
  } catch (err) {
    setRenderMsg('Delete failed: ' + err.message, true);
  }
}

// ── Script pane resizer (draggable right edge) ──
function initPaneResize() {
  const handle = $('pane-resize-handle');
  const pane = document.querySelector('.pane-script');
  if (!handle || !pane) return;

  const minW = 240;
  const getMaxW = () => Math.floor(window.innerWidth * 0.70);

  // Lower the min-width constraint so the 240px clamp can take effect (overrides CSS 360px).
  pane.style.minWidth = minW + 'px';

  // Apply persisted (or fallback) width immediately on load.
  // Use explicit flex:none + width so flex children don't fight it.
  const saved = localStorage.getItem('script-pane-width-px');
  let initialW = null;
  if (saved != null) {
    const parsed = parseFloat(saved);
    if (Number.isFinite(parsed)) initialW = parsed;
  }
  if (initialW != null) {
    initialW = Math.max(minW, Math.min(initialW, getMaxW()));
    pane.style.flex = 'none';
    pane.style.width = initialW + 'px';
  } else {
    // Fallback to 40% (as explicit to match spec; CSS default remains if omitted)
    pane.style.flex = 'none';
    pane.style.width = '40%';
  }

  // Drag handling (unique locals to avoid any global collision)
  handle.addEventListener('mousedown', (downEvt) => {
    downEvt.preventDefault();
    const startX = downEvt.clientX;
    // Measure current rendered width (works whether px or % at start of drag)
    const startWidth = pane.getBoundingClientRect().width;

    handle.classList.add('active');
    document.body.classList.add('resizing-script-pane');
    const prevUserSelect = document.body.style.userSelect;
    document.body.style.userSelect = 'none';

    const onMouseMove = (moveEvt) => {
      const delta = moveEvt.clientX - startX;
      let newW = startWidth + delta;
      const maxW = getMaxW();
      newW = Math.max(minW, Math.min(newW, maxW));
      pane.style.flex = 'none';
      pane.style.width = newW + 'px';
    };

    const onMouseUp = () => {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      handle.classList.remove('active');
      document.body.classList.remove('resizing-script-pane');
      document.body.style.userSelect = prevUserSelect || '';
      // Persist the final pixel width
      const finalW = pane.getBoundingClientRect().width;
      localStorage.setItem('script-pane-width-px', String(Math.round(finalW)));
    };

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
}

// ── Script pane minimize toggle (header button) ──
function initPaneMinimize() {
  const pane = document.querySelector('.pane-script');
  const btn = document.getElementById('pane-minimize-btn');
  const handle = document.getElementById('pane-resize-handle');
  if (!pane || !btn) return;

  // Load state: if minimized on load, apply class BEFORE transition
  const prevTransition = pane.style.transition;
  pane.style.transition = 'none';

  const isMinimized = localStorage.getItem('script-pane-minimized') === 'true';
  if (isMinimized) {
    pane.classList.add('pane-minimized');
    btn.textContent = '□';
    btn.title = 'Restore pane';
  } else {
    pane.classList.remove('pane-minimized');
    btn.textContent = '−';
    btn.title = 'Minimize pane';
  }

  // Reflow to lock the no-transition state, then restore transition for future toggles
  void pane.offsetWidth;
  pane.style.transition = prevTransition || 'width 0.25s ease, min-width 0.25s ease';

  // Toggle behavior
  btn.addEventListener('click', () => {
    const nowMinimized = pane.classList.toggle('pane-minimized');
    const textarea = document.getElementById('script-editor');

    if (nowMinimized) {
      localStorage.setItem('script-pane-minimized', 'true');
      if (textarea) textarea.style.display = 'none';
      pane.style.overflow = 'hidden';
      btn.textContent = '□';
      btn.title = 'Restore pane';
    } else {
      localStorage.setItem('script-pane-minimized', 'false');
      if (textarea) textarea.style.display = '';
      pane.style.overflow = '';
      btn.textContent = '−';
      btn.title = 'Minimize pane';

      // Restore width from localStorage 'script-pane-width-px'; if absent use default 360px
      const savedWidth = localStorage.getItem('script-pane-width-px');
      if (savedWidth != null) {
        const parsed = parseFloat(savedWidth);
        if (Number.isFinite(parsed)) {
          pane.style.width = parsed + 'px';
          pane.style.flex = 'none';
        } else {
          pane.style.width = '';
          pane.style.flex = 'none';
        }
      } else {
        pane.style.width = '360px';
        pane.style.flex = 'none';
      }
    }
  });
}

// ── Init ──

async function init() {
  wireEvents();
  initPaneResize();
  initPaneMinimize();
  connectSSE();
  try {
    const projects = await listProjects();
    if (projects.length === 1) loadProject(projects[0]);
  } catch (err) {
    setStatus(err.message, 'error');
  }
}

init();
</script>
